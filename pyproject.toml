[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-meeting-harness"
version = "0.1.0"
description = "A local evidence-first harness for recurring meeting summaries"
requires-python = ">=3.11"
dependencies = []
readme = "README.md"
license = {text = "MIT"}

[project.scripts]
meeting-harness = "meeting_harness.cli:main"

[tool.setuptools.packages.find]
include = ["meeting_harness*"]
